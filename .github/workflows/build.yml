name: APK olustur

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_ORG: com.hesaplaaraci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android dosyalarını oluştur
        run: |
          flutter create --platforms=android --org "$APP_ORG" --project-name hesapla .
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="Hesapla"/' android/app/src/main/AndroidManifest.xml

      - name: Sabit imzayı yükle
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: APK derle
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: hesapla-apk
          path: build/app/outputs/flutter-apk/app-release.apk
